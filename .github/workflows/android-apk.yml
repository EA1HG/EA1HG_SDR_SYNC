name: Android APK

# Compila la app del móvil (carpeta android/). Se lanza a mano (Actions → Android APK → Run workflow)
# o al subir una etiqueta que empiece por «android-v» (por ejemplo android-v1.0.0), y entonces adjunta el APK a la Release.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Preparar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EA1HG_SDR_remoto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EA1HG_SDR_remoto
          path: EA1HG_SDR_remoto.apk
      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EA1HG_SDR_remoto.apk
